# In ~/.codex/config.toml, or: codex mcp add prepped -- npx -y prepped@latest mcp --connection my-tool
# On Windows: command = "cmd" and args = ["/c", "npx", "-y", "prepped@latest", "mcp", "--connection", "my-tool"]
[mcp_servers.prepped]
command = "npx"
args = ["-y", "prepped@latest", "mcp", "--connection", "my-tool"]
